<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire Ambitions</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b1226;color:#e8eaf0;overflow:hidden}
button{background:#2f6fed;color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
button:hover:not(:disabled){filter:brightness(1.15)}button:disabled{background:#444;color:#999;cursor:not-allowed}
button.sec{background:#2c3550}button.on{background:#2f6fed}button.red{background:#c0393e}button.grn{background:#23995a}
#game{display:none}
#top{position:fixed;top:0;left:0;right:0;min-height:46px;background:#1b2030;display:flex;gap:16px;align-items:center;padding:6px 12px;z-index:5;border-bottom:1px solid #2c3550;font-size:14px;flex-wrap:wrap}
#top b{color:#7fd1ff}#top .sp{flex:1}
#filters{position:fixed;top:58px;left:10px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;max-width:55vw;margin-top:6px}
#panel{position:fixed;top:64px;right:10px;width:320px;max-height:calc(100vh - 80px);overflow:auto;background:#1b2030ee;border:1px solid #2c3550;border-radius:10px;padding:14px;z-index:5;display:none;font-size:13px}
#panel h2{margin:0 0 4px;font-size:17px}table{width:100%;margin:8px 0;border-collapse:collapse}td{padding:3px 0}td:last-child{text-align:right}
#panel button{width:100%;margin-top:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#000}
#legend{position:fixed;bottom:10px;left:10px;font-size:12px;background:#1b2030cc;padding:8px 10px;border-radius:8px;z-index:5}
#legend i{display:inline-block;width:10px;height:10px;margin:0 4px 0 8px;border-radius:2px}
#msg{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#2f6fed;padding:8px 16px;border-radius:8px;display:none;z-index:30}
#tip{position:fixed;pointer-events:none;background:#000c;padding:4px 8px;border-radius:6px;font-size:12px;display:none;z-index:6}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column}
#loading{background:#0b1226;z-index:40}#menu{display:none;background:linear-gradient(#0b122688,#0b1226cc)}
#loading h1,#menu h1{font-size:44px;margin:0 0 4px;letter-spacing:2px}#menu p{color:#9fb0d0;margin:0 0 24px}
.bar{width:320px;height:10px;background:#222b45;border-radius:6px;overflow:hidden;margin:14px 0 8px}.bar div{height:100%;width:0;background:#2f6fed;transition:width .25s}
.mb{display:flex;flex-direction:column;gap:10px;width:260px}.mb button{padding:12px;font-size:15px}
#modal{display:none;background:#0009;z-index:25}#mbox{background:#1b2030;border:1px solid #2c3550;border-radius:12px;padding:18px;width:min(520px,94vw);max-height:84vh;overflow:auto;font-size:14px}
#mbox h2{margin:0 0 10px}#mbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chart{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}.chart i{display:block;border-radius:2px 2px 0 0}
</style></head><body>
<div id="game">
 <div id="top"><span>📅 <b id="date"></b></span><span>💰 <b id="money"></b></span><span>🏢 Biens : <b id="count">0</b></span><span>📈 Patrimoine net : <b id="wealth"></b></span><span class="sp"></span>
 <button class="sec" onclick="openBizList()">🏪 Entreprises</button><button class="sec" onclick="openProps()">📋 Patrimoine</button><button class="sec" onclick="openFin()">💶 Finances</button>
 <button class="sec" id="spd" onclick="cycleSpeed()">⏩ x1</button><button class="sec" id="night" onclick="toggleNight()">🌙 Nuit</button><button class="sec" onclick="gameMenu()">☰ Menu</button></div>
 <div id="filters"></div><div id="panel"></div>
 <div id="legend"></div>
</div>
<div id="tip"></div><div id="msg"></div>
<div id="menu" class="ov"><h1>EMPIRE AMBITIONS</h1><p>Simulation entrepreneuriale 3D</p><div class="mb" id="mb"></div></div>
<div id="modal" class="ov" onclick="if(event.target===this)closeModal()"><div id="mbox"></div></div>
<div id="loading" class="ov"><h1>EMPIRE AMBITIONS</h1><div class="bar"><div id="pb"></div></div><span id="pt">Chargement…</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms||0));
// ---------- DONNÉES ----------
const STATUS={sale:['À vendre','#3ddc84'],rent:['À louer','#f5c542'],owned:['Votre propriété','#2f9bff'],sublet:['Propriété louée à un tiers','#b46cff'],leased:['Loué par vous','#ff8a3d'],occupied:['Occupé','#999999'],blocked:['Non constructible','#e5484d']};
const TYPES={commerce:['Local commercial',0xd4a373],logement:['Logement',0xc3cfdf],bureau:['Bureaux',0x8fb0c8],entrepot:['Entrepôt',0x9aa070]};
const ACT={commerce:'Restauration, boutique, café, coiffure',logement:'Habitation',bureau:'Services, bureaux',entrepot:'Stockage, distribution'};
const CF={'Neuf':1.1,'Bon':1,'Moyen':.92,'À rénover':.8},RC={'Neuf':0,'Bon':30,'Moyen':90,'À rénover':220};
const STREETS=['Rue Victor Hugo','Avenue de la République','Rue des Lilas','Boulevard Gambetta','Rue Pasteur','Rue du Commerce'];
const N=6,LOT=8,BLK=3,PITCH=BLK*LOT+6,PRICE_K=.5;
const buildings=[];let seed=42;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function gen(){seed=42;for(let bx=0;bx<N;bx++)for(let bz=0;bz<N;bz++){const dc=Math.hypot(bx-(N-1)/2,bz-(N-1)/2);
 for(let i=0;i<BLK;i++)for(let j=0;j<BLK;j++){const r=rnd(),center=dc<2;
  const type=center?(r<.5?'commerce':r<.8?'bureau':'logement'):(dc>3.2&&r<.35?'entrepot':r<.6?'logement':r<.8?'commerce':'bureau');
  const w=5+Math.floor(rnd()*3),d=5+Math.floor(rnd()*3),floors=center?1+Math.floor(rnd()*(type==='bureau'?9:4)):1+Math.floor(rnd()*3);
  const area=Math.round(w*d*floors*9),k=(center?1.6:1)*(type==='commerce'?1.3:1),old=Math.round(area*(900+rnd()*500)*k/1000)*1000;
  const s=rnd(),st=s<.08?'blocked':s<.5?'sale':s<.7?'rent':'occupied',id=buildings.length;
  const cond=['Neuf','Bon','Moyen','À rénover'][Math.floor(rnd()*4)];
  buildings.push({id,type,floors,area,w,d,h:floors*3.2+1,price:Math.round(old*PRICE_K/1000)*1000,rent:Math.round(old*.0048/10)*10,
   base:st,baseOwner:st==='occupied'?'Entreprise concurrente':st==='blocked'?'—':'Aucun',baseCond:cond,
   x:(bx-(N-1)/2)*PITCH+(i-1)*LOT,z:(bz-(N-1)/2)*PITCH+(j-1)*LOT,address:`${1+id%90} ${STREETS[(bx+bz)%6]}`,name:`${TYPES[type][0]} n°${id+1}`});}}}
// ---------- ÉTAT ----------
const newG=m=>({money:m,day:0,owned:[],sublet:[],leased:[],cond:{},debt:0,hist:[],biz:{},bizRev:0});
let G=newG(50000),inGame=false,sel=null,filter='all',speed=1,uiPause=false;
const base=new Date(2026,0,1);
const fmt=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const valueOf=b=>Math.round(b.price*CF[b.cond]);
const renoCost=b=>Math.round(b.area*RC[b.cond]);
const hasSave=()=>{try{const s=JSON.parse(localStorage.getItem('ea_save')||'null');return !!s&&s.cityVer===7}catch(e){return false}};
function save(){try{G.cityVer=7;localStorage.setItem('ea_save',JSON.stringify(G))}catch(e){}}
function apply(){buildings.forEach(b=>{b.state=b.base;b.owner=b.baseOwner;b.cond=G.cond[b.id]||b.baseCond;
 if(G.owned.includes(b.id)){b.state=G.sublet.includes(b.id)?'sublet':'owned';b.owner='Vous'}
 else if(G.leased.includes(b.id)){b.state='leased';b.owner='Vous (locataire)'}})}
function proj(){let inc=0,exp=0;G.sublet.forEach(i=>inc+=buildings[i].rent);G.owned.forEach(i=>exp+=Math.round(buildings[i].price*.001));
 G.leased.forEach(i=>exp+=buildings[i].rent);exp+=Math.round(G.debt*.015);Object.values(G.biz).forEach(z=>{if(z.open)exp+=z.staff*(1800+150*(z.train||0))});return{inc,exp}}
function month(){window.p3Month&&p3Month();const p=proj(),rev=Math.round(G.bizRev),n=p.inc+rev-p.exp;G.bizRev=0;G.money+=p.inc-p.exp;G.hist.push({inc:p.inc+rev,exp:p.exp});if(G.hist.length>12)G.hist.shift();toast(`Bilan du mois : ${n>=0?'+':''}${fmt(n)}`+(G.money<0?' ⚠ Trésorerie négative !':''));save()}
function hud(){const mine=buildings.filter(b=>G.owned.includes(b.id));
 $('money').textContent=fmt(G.money);$('count').textContent=G.owned.length+G.leased.length;
 $('wealth').textContent=fmt(G.money+mine.reduce((a,b)=>a+valueOf(b),0)-G.debt);
 $('date').textContent=new Date(base.getTime()+G.day*864e5).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}
let tt;function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(tt);tt=setTimeout(()=>m.style.display='none',2600)}
// ---------- SCÈNE ----------
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec9e8);scene.fog=new THREE.Fog(0x9ec9e8,160,430);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.5,1000);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);
const hemi=new THREE.HemisphereLight(0xffffff,0x556655,.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(80,140,60);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-140,right:140,top:140,bottom:-140,far:400});sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const meshes=[],texCache={},EXT=260;
function paint(){buildings.forEach(b=>{b.roof.material.color.set(b.shop?'#1fd1c4':b.flash?'#ff4fd8':STATUS[b.state][1]);
 const show=filter==='all'||(filter==='sale'?(b.state==='sale'||b.state==='rent'):filter==='mine'?(G.owned.includes(b.id)||G.leased.includes(b.id)):b.type===filter);
 b.body.material.opacity=b.roof.material.opacity=show?1:.12});hud()}
// ---------- CAMÉRA & SOURIS ----------
const C={t:new THREE.Vector3(0,0,0),yaw:.8,pitch:.9,dist:360};
function updCam(){C.pitch=Math.max(.15,Math.min(1.5,C.pitch));C.dist=Math.max(18,Math.min(900,C.dist));
 cam.position.set(C.t.x+C.dist*Math.cos(C.pitch)*Math.sin(C.yaw),C.dist*Math.sin(C.pitch),C.t.z+C.dist*Math.cos(C.pitch)*Math.cos(C.yaw));cam.lookAt(C.t)}
let drag=null,moved=0,lastH=0;const el=ren.domElement,ray=new THREE.Raycaster();
const hit=e=>{ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);return ray.intersectObjects(meshes)[0]};
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};moved=0;el.setPointerCapture(e.pointerId);$('tip').style.display='none'});
el.addEventListener('pointermove',e=>{if(!inGame)return;
 if(!drag){const n=performance.now();if(n-lastH<60)return;lastH=n;const h=hit(e),t=$('tip');
  if(h){const b=buildings[h.object.userData.id];t.textContent=`${b.name} — ${STATUS[b.state][0]} · ${b.hood||''}`;t.style.cssText=`display:block;left:${e.clientX+14}px;top:${e.clientY+14}px`;el.style.cursor='pointer'}else{t.style.display='none';el.style.cursor='default'}return}
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;
 if(drag.pan){const k=C.dist*.0016;C.t.x+=(-dx*Math.cos(C.yaw)-dy*Math.sin(C.yaw))*k;C.t.z+=(dx*Math.sin(C.yaw)-dy*Math.cos(C.yaw))*k;C.t.x=Math.max(-CITY.R-60,Math.min(CITY.R+60,C.t.x));C.t.z=Math.max(-CITY.R-60,Math.min(CITY.R+60,C.t.z))}
 else{C.yaw-=dx*.006;C.pitch+=dy*.006}updCam()});
el.addEventListener('pointerup',e=>{const was=drag;drag=null;if(was&&moved<5&&inGame){const h=hit(e);if(!h){sel=null;$('panel').style.display='none';outline.visible=false}else{sel=buildings[h.object.userData.id];try{show()}catch(err){console.error(err);toast('Erreur fiche bâtiment : '+err.message)}}}});
el.addEventListener('wheel',e=>{e.preventDefault();C.dist*=e.deltaY>0?1.1:.9;updCam()},{passive:false});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
const outline=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true}));outline.visible=false;scene.add(outline);
function focus(b){C.t.set(b.x,0,b.z);C.dist=70;updCam()}
// ---------- FICHE & ACTIONS ----------
function show(){const b=sel;if(!b)return;const [lab,col]=STATUS[b.state];
 outline.visible=true;outline.scale.set(b.w+.7,b.h+.9,b.d+.7);outline.position.set(b.x,.3+b.h/2,b.z);outline.rotation.y=b.ry||0;
 const buy=buyCost(b),own=G.owned.includes(b.id);let btn='';
 const B=(a,t,cls,dis)=>`<button class="${cls||''}" ${dis?'disabled':''} onclick="act('${a}')">${t}</button>`;
 if(b.state==='sale')btn+=B('buy',`Acheter (${fmt(buy)}, frais 5 % inclus)`,'',G.money<buy);
 if(b.state==='rent')btn+=B('rent',`Louer (1er loyer + caution : ${fmt(b.rent*2)})`,'grn',G.money<b.rent*2);
 if(own){btn+=B('sublet',G.sublet.includes(b.id)?'Arrêter la sous-location':`Mettre en location (+${fmt(b.rent)}/mois)`,'sec');
  btn+=B('reno',`Rénover (${fmt(renoCost(b))})`,'sec',!renoCost(b)||G.money<renoCost(b));btn+=B('sell',`Vendre (${fmt(valueOf(b)*.92)})`,'red')}
 if(b.state==='leased')btn+=B('unrent',`Résilier le bail (caution rendue : ${fmt(b.rent)})`,'red');
 if(own||b.state==='leased')btn+=G.biz[b.id]?B('biz','🏪 Gérer l\'entreprise',''):B('co','🏪 Créer une entreprise','grn',!canCreate(b));
 if(b.shop)btn+=B('shop','🛒 Entrer dans le magasin','grn');
 btn+=B('focus','🎯 Centrer la caméra','sec');
 $('panel').innerHTML=`<h2>${b.name}</h2><div>${b.address} · <i>${b.hood||""}</i></div><span class="tag" style="background:${col}">${lab}</span>
 <table><tr><td>Type</td><td>${TYPES[b.type][0]}</td></tr><tr><td>Surface</td><td>${b.area} m²</td></tr><tr><td>Niveaux</td><td>${b.floors}</td></tr>
 <tr><td>État</td><td>${b.cond}</td></tr><tr><td>Propriétaire</td><td>${b.owner}</td></tr>
 <tr><td>Prix de vente</td><td>${['sale','owned','sublet'].includes(b.state)?fmt(b.price):'—'}</td></tr>
 <tr><td>Loyer / mois</td><td>${fmt(b.rent)}</td></tr><tr><td>Valeur estimée</td><td>${fmt(valueOf(b))}</td></tr>
 <tr><td>Activités</td><td>${ACT[b.type]}</td></tr><tr><td>Rénovation</td><td>${fmt(renoCost(b))}</td></tr></table>${btn}`;$('panel').style.display='block'}
function act(a){const b=sel;if(!b)return;const rm=(arr,id)=>{const i=arr.indexOf(id);if(i>=0)arr.splice(i,1)};
 if(a==='focus')return focus(b);if(a==='co')return wizStart();if(a==='biz')return bizModal(b.id);if(a==='shop')return shopOpen();
 if(['sell','unrent','sublet'].includes(a)&&G.biz[b.id])return toast('Ce bien héberge une entreprise');
 if(a==='buy'){const c=buyCost(b);if(b.state!=='sale'||G.money<c)return;G.money-=c;G.owned.push(b.id);toast('Achat effectué : '+b.name)}
 if(a==='rent'){if(b.state!=='rent'||G.money<b.rent*2)return;G.money-=b.rent*2;G.leased.push(b.id);toast('Bail signé : '+b.name)}
 if(a==='unrent'){G.money+=b.rent;rm(G.leased,b.id);toast('Bail résilié, caution remboursée')}
 if(a==='sublet'){G.sublet.includes(b.id)?rm(G.sublet,b.id):G.sublet.push(b.id)}
 if(a==='reno'){const c=renoCost(b);if(G.money<c)return;G.money-=c;G.cond[b.id]='Neuf';toast('Rénovation terminée')}
 if(a==='sell'){if(!confirm('Vendre ce bien ?'))return;G.money+=Math.round(valueOf(b)*.92);rm(G.owned,b.id);rm(G.sublet,b.id);delete G.cond[b.id];toast('Bien vendu')}
 apply();save();paint();show()}
// ---------- MODALES & MENUS ----------
function modal(h){$('mbox').innerHTML=h;$('modal').style.display='flex'}
function closeModal(){$('modal').style.display='none';if(inGame&&$('mbox').dataset.menu)uiPause=false;$('mbox').dataset.menu=''}
function openProps(){const l=buildings.filter(b=>G.owned.includes(b.id)||G.leased.includes(b.id));
 modal(`<h2>📋 Patrimoine (${l.length})</h2>`+(l.length?`<table>${l.map(b=>`<tr><td>${b.name}<br><small>${b.address}</small></td><td><span class="tag" style="background:${STATUS[b.state][1]}">${STATUS[b.state][0]}</span><br>${fmt(valueOf(b))}</td><td><button onclick="goTo(${b.id})">Voir</button></td></tr>`).join('')}</table>`:'<p>Vous ne possédez encore aucun bien.</p>')+'<div class="row"><button class="sec" onclick="closeModal()">Fermer</button></div>')}
function goTo(id){closeModal();sel=buildings[id];focus(sel);show()}
function openFin(){const p=proj(),mx=Math.max(1,...G.hist.map(h=>Math.max(h.inc,h.exp)),p.inc,p.exp);
 modal(`<h2>💶 Finances</h2><table><tr><td>Trésorerie</td><td>${fmt(G.money)}</td></tr><tr><td>Dette</td><td>${fmt(G.debt)} (intérêt 1,5 %/mois)</td></tr>
 <tr><td>CA entreprises (mois en cours)</td><td style="color:#3ddc84">+${fmt(G.bizRev)}</td></tr><tr><td>Revenus locatifs mensuels</td><td style="color:#3ddc84">+${fmt(p.inc)}</td></tr><tr><td>Dépenses mensuelles</td><td style="color:#ff6b6b">−${fmt(p.exp)}</td></tr><tr><td><b>Résultat mensuel</b></td><td><b>${fmt(p.inc-p.exp)}</b></td></tr></table>
 <div>Historique (vert : revenus, rouge : dépenses)</div><div class="chart">${G.hist.map(h=>`<div><i style="height:${h.inc/mx*70}px;background:#3ddc84"></i><i style="height:${h.exp/mx*70}px;background:#ff6b6b"></i></div>`).join('')||'<small>Aucun mois écoulé.</small>'}</div>
 <div class="row"><button onclick="loan(10000)">Emprunter 10 000 €</button><button onclick="loan(25000)">Emprunter 25 000 €</button><button class="grn" onclick="repay(10000)">Rembourser 10 000 €</button><button class="sec" onclick="closeModal()">Fermer</button></div>`)}
function loan(n){if(G.debt+n>100000)return toast('Plafond de dette : 100 000 €');G.money+=n;G.debt+=n;save();hud();openFin()}
function repay(n){n=Math.min(n,G.debt);if(!n)return toast('Aucune dette');if(G.money<n)return toast('Trésorerie insuffisante');G.money-=n;G.debt-=n;save();hud();openFin()}
function helpModal(){modal(`<h2>🎮 Commandes</h2><p>• <b>Clic gauche + glisser</b> : orbiter<br>• <b>Clic droit / Maj + glisser</b> : déplacer<br>• <b>Molette</b> : zoom<br>• <b>Clic sur un bâtiment</b> : fiche, achat, location<br>• <b>Échap</b> : menu</p><p>Achetez des biens, sous-louez-les, rénovez-les pour gagner de la valeur. Chaque mois (30 jours) tombent loyers, entretien et intérêts.</p><div class="row"><button onclick="closeModal()">Fermer</button></div>`)}
function menuButtons(list){$('mb').innerHTML='';list.forEach(([t,f,dis,cls])=>{const b=document.createElement('button');b.textContent=t;b.disabled=!!dis;b.className=cls||'';b.onclick=f;$('mb').appendChild(b)})}
function mainMenu(){inGame=false;uiPause=true;$('game').style.display='none';$('panel').style.display='none';outline.visible=false;$('menu').style.display='flex';
 menuButtons([['▶ Continuer',()=>{try{G=Object.assign(newG(0),JSON.parse(localStorage.getItem('ea_save')))}catch(e){return}start()},!hasSave()],['🆕 Nouvelle partie',newGame],['🎮 Commandes',helpModal,0,'sec'],['ℹ️ À propos',()=>modal('<h2>Empire Ambitions</h2><p>Prototype Phase 1 : ville 3D, immobilier, finances.<br>Inspiré de Big Ambitions et Empire Immo, sans reprise de leurs ressources.</p><div class="row"><button onclick="closeModal()">Fermer</button></div>'),0,'sec']])}
function newGame(){modal('<h2>Nouvelle partie</h2><p>Choisissez la difficulté :</p><div class="row"><button class="grn" onclick="begin(150000)">Facile — 150 000 €</button><button onclick="begin(80000)">Normal — 80 000 €</button><button class="red" onclick="begin(40000)">Difficile — 40 000 €</button><button class="sec" onclick="closeModal()">Annuler</button></div>')}
function begin(m){G=newG(m);save();closeModal();start()}
function start(){apply();paint();$('menu').style.display='none';$('game').style.display='block';inGame=true;uiPause=false;sel=null;C.t.set(0,0,0);C.dist=360;updCam()}

 for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(o[j][i]!==-1||d.some(c=>c[0]===i&&c[1]===j))return false;return true}
function circ(biz,g){const o=occ(biz,g),seen=new Set(),q=[];doorCells(g).forEach(c=>{q.push(c);seen.add(c.join())});
 while(q.length){const[x,y]=q.pop();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const X=x+a,Y=y+b,k=X+','+Y;if(X<0||Y<0||X>=g.w||Y>=g.h||seen.has(k)||o[Y][X]!==-1)return;seen.add(k);q.push([X,Y])})}
 return biz.layout.every(p=>{const[w,h]=dimsOf(p.id,p.r);for(let j=p.y-1;j<=p.y+h;j++)for(let i=p.x-1;i<=p.x+w;i++){if(((j===p.y-1||j===p.y+h)!==(i===p.x-1||i===p.x+w))&&seen.has(i+','+j))return true}return false})}

 const[w,h]=dimsOf(id,r);let ok=true;if(sp)for(let j=y-1;j<=y+h&&ok;j++)for(let i=x-1;i<=x+w;i++)if(o[j]&&o[j][i]!==undefined&&o[j][i]!==-1){ok=false;break}

const dist2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

<script>

['bur','coif','repar'].forEach(k=>{if(!SECT[k].t.includes('logement'))SECT[k].t.push('logement')});

rivals=function(id){const b=buildings[id],k=G.biz[id].s;let n=buildings.filter(o=>o.state==='occupied'&&!o.shop&&o.cs===k&&Math.hypot(o.x-b.x,o.z-b.z)<60).length;
 Object.entries(G.biz).forEach(([i,z])=>{if(+i!==+id&&z.s===k&&Math.hypot(buildings[i].x-b.x,buildings[i].z-b.z)<60)n+=.6});return n};

 const l=window.supFor?supFor(z.s):[];let paid=0;
 if(l.length&&window.addSup){const share=need/l.length;l.forEach(([k,sp])=>{const n=Math.max(1,Math.round(share/sp[2]));addSup(z,k,n);paid+=n*sp[2]})}else{z.stock+=need;paid=need}
 G.money-=paid+fee;z.autoSpent=(z.autoSpent||0)+paid+fee}
// ---- tick quotidien (remplace celui du cœur)
function dayTick(){Object.entries(G.biz).forEach(([id,biz])=>{
 biz.orders=biz.orders.filter(o=>{if(o.due<=G.day){biz.inv[o.i]=(biz.inv[o.i]||0)+1;toast('📦 Livraison reçue : '+ITEMS[o.i][0]);return false}return true});

 const s=SECT[biz.s],b=buildings[id],cnt={};biz.layout.forEach(p=>cnt[p.id]=(cnt[p.id]||0)+1);let extra=0;Object.entries(cnt).forEach(([i,n])=>extra+=Math.max(0,n-(s.req[i]||0)));
 if(biz.auto)autoBuy(biz,s);
 let rev=s.rev*biz.q*locOf(b)*(1+.08*Math.min(5,extra))*Math.sqrt(Math.min(1,biz.staff/s.staff))*(.85+Math.random()*.3)*(window.bizMult?bizMult(id,biz):1),cogs=rev*.35*(.5+.5*biz.q);
 if(biz.stock<cogs){rev*=.4;cogs=biz.stock;toast('⚠ Rupture de stock : '+biz.name)}
 biz.stock-=cogs;biz.rev=Math.round(rev);G.money+=biz.rev;G.bizRev+=biz.rev});
 dailyEvents();checkMis()}

const EVENTS=[
 {w:3,run(){const o=openBiz();if(!o)return;const[i,z]=o;if(z.staff<3)return;z.strike=G.day+3;toast(`✊ Grève chez ${z.name} : fermée 3 jours`)}},
