function unloadAt(id){const z=G.biz[id],b=buildings[id],p=doorPt(b);let n=0;const take=l=>{for(let i=l.length-1;i>=0;i--){const c=l[i];if(c.biz!==+id)continue;if(c.t==='furn')z.inv[c.k]=(z.inv[c.k]||0)+1;else addSup(z,c.k,c.n);n+=c.n;l.splice(i,1)}};
 take(wk().hand);WK.vehs.forEach((v,i)=>{if(Math.hypot(v.x-p[0],v.z-p[1])<18)take(cargoList(i))});save();if(n)toast(`📦 ${n} carton(s) déchargé(s) chez ${z.name}`);else toast('Rien à décharger pour cette entreprise (véhicule trop loin ?)');bizMenu(b)}
function pendingFor(id){const p=buildings[id],d=doorPt(p);let n=bx12(wk().hand.filter(c=>c.biz===+id));WK.vehs.forEach((v,i)=>{if(Math.hypot(v.x-d[0],v.z-d[1])<18)n+=bx12(cargoList(i).filter(c=>c.biz===+id))});return n}
// ---------- menus ----------
function bizMenu(b){const z=G.biz[b.id],n=pendingFor(b.id);modal(`<h2>🏪 ${z.name}</h2><small>${b.address} · ${z.open?'Ouverte':'Fermée'}</small><div class="row" style="flex-direction:column;margin-top:8px"><button onclick="closeModal();edOpen(${b.id})">🪑 Entrer et aménager (mobilier, décor)</button><button onclick="bizModal(${b.id})">⚙️ Bureau : gérer l'entreprise</button><button class="${n?'grn':'sec'}" ${n?'':'disabled'} onclick="unloadAt(${b.id})">📦 Décharger les cartons (${n})</button><button class="sec" onclick="closeModal()">Sortir</button></div>`)}
function poiOpen(b){const r=b.poi;if(r==='bank')bankModal();else if(r==='broker')bourse();else if(r==='train')skillModal();else if(r==='dealer')dealerModal();else if(r==='job')jobModal()}
function dealerModal(){const P=p4();modal(`<h2>🚗 Concessionnaire</h2><small>Votre véhicule est garé devant ; montez avec F. Capacité en cartons. Pas de chauffeur à payer : c'est vous qui conduisez.</small><table>${Object.entries(VEH).map(([k,v])=>`<tr><td><b>${v[0]}</b><br><small>${WCAP[k]} cartons · entretien ${fmt(v[2])}/mois</small></td><td>${fmt(v[1])}</td><td><button ${G.money<v[1]?'disabled':''} onclick="buyVeh('${k}')">Acheter</button></td></tr>`).join('')}</table><b>Votre flotte</b><table>${P.veh.map((v,i)=>`<tr><td>${VEH[v][0]}</td><td>${fmt(Math.round(VEH[v][1]*.7))}</td><td><button class="red" onclick="sellVeh(${i})">Vendre</button></td></tr>`).join('')||'<tr><td>Aucun véhicule</td></tr>'}</table><div class="row"><button class="sec" onclick="closeModal()">Sortir</button></div>`)}
function jobModal(){const ids=Object.keys(G.biz);modal(`<h2>🧑‍💼 Agence pour l'emploi</h2><small>Choisissez l'entreprise pour laquelle recruter.</small><div class="row" style="flex-direction:column;margin-top:8px">${ids.map(i=>`<button onclick="persModal(${i})">${G.biz[i].name} (${ensureEmps(G.biz[i]).length} employé(s))${hasRepair(G.biz[i])?' 🔧':''}</button>`).join('')||'<small>Aucune entreprise.</small>'}<button class="sec" onclick="closeModal()">Sortir</button></div>`)}
// hub : les commandes à distance pointent vers les lieux
const _hub=hub;hub=function(){_hub();if(WK.on)$('mbox').insertAdjacentHTML('beforeend','<small>🚶 Mode joueur : la banque, la holding, l\'expansion et les véhicules se gèrent sur place (GPS automatique).</small>')};
// ---------- véhicules : plus de chauffeur à payer, voiture ajoutée ----------
VEH.car=['Voiture',3500,150,800];
// ---------- réparateur ----------
function hasRepair(z){return(z.emps||[]).some(e=>e.role==='Réparateur')}
const _pm12=persModal;persModal=function(id){_pm12(id);const z=G.biz[id];$('mbox').insertAdjacentHTML('afterbegin',`<div style="padding:6px;border-radius:8px;background:${hasRepair(z)?'#123a22':'#3a2a12'};margin-bottom:6px">${hasRepair(z)?'🔧 Un réparateur est employé : plus aucune panne dans cette entreprise.':'⚠ Aucun réparateur : des pannes peuvent immobiliser le matériel. Recrutez un « Réparateur » à l\'agence pour l\'emploi.'}</div>`)};
const _p3d12=p3Day;p3Day=function(){_p3d12();Object.entries(G.biz).forEach(([id,z])=>{if(hasRepair(z)&&z.broken&&z.broken.length){const g=gridOf(buildings[id]);z.broken.splice(0).forEach(x=>{if(!autoFit(z,g,x))z.inv[x]=(z.inv[x]||0)+1});toast('🔧 Le réparateur a remis en état le matériel de '+z.name)}})};

</script>
<script>
addEventListener('error',e=>{const m=document.getElementById('msg');if(m){m.textContent='Erreur : '+e.message;m.style.display='block'}});
boot();
</script>
</body></html>
